name: Build and test

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run Android build and tests
        run: >-
          ./gradlew
          :shared:testAndroidHostTest
          :androidApp:testDebugUnitTest
          :androidApp:lintDebug
          :androidApp:assembleDebug
          --no-daemon
          --stacktrace

      - name: Upload Android reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS build and tests
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Xcode version
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.1"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run iOS simulator tests
        run: >-
          ./gradlew
          :shared:iosSimulatorArm64Test
          --no-daemon
          --stacktrace

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Build-iOS.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/Build-iOS.log"

      - name: Upload iOS reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: |
            shared/build/test-results/iosSimulatorArm64Test/**/*.xml
            shared/build/reports/tests/iosSimulatorArm64Test/**
            ${{ runner.temp }}/Build-iOS.log
            ${{ runner.temp }}/Build-iOS.xcresult
          if-no-files-found: ignore
          retention-days: 7
