name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-kotlin:
    name: Analyze Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Kotlin
        run: |
          set -o pipefail
          ./gradlew :androidApp:compileDebugKotlin --no-daemon --no-build-cache --stacktrace 2>&1 \
            | tee "$RUNNER_TEMP/CodeQL-Kotlin.log"

      - name: Analyze Kotlin
        uses: github/codeql-action/analyze@v4

      - name: Upload Kotlin diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: codeql-kotlin-diagnostics
          path: |
            ${{ runner.temp }}/CodeQL-Kotlin.log
            **/build/reports/**/*.html
            **/build/reports/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  analyze-swift:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Xcode version
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.6"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - name: Build iOS application
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/CodeQL-iOS.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/CodeQL-iOS-build.log"

      - name: Analyze Swift
        uses: github/codeql-action/analyze@v4

      - name: Upload Swift diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: codeql-swift-diagnostics
          path: |
            ${{ runner.temp }}/CodeQL-iOS-build.log
            ${{ runner.temp }}/CodeQL-iOS.xcresult
            **/build/reports/**/*.html
            **/build/reports/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
